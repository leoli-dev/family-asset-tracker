<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Asset Tracker">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <title>Family Asset Tracker</title>
    <style>
      /* Painted before any JS/CSS loads so the first frame isn't blank */
      html, body { margin: 0; background: #f8fafc; }
      #boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      #boot i { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #bfdbfe; border-top-color: #3b82f6; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" aria-label="Loading"><i></i></div></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
